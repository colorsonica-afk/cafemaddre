<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PosMaddre</title>

<!-- PWA -->
<link rel="manifest" href="manifest-pos.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PosMaddre">
<meta name="theme-color" content="#4A2E1A">
<link rel="apple-touch-icon" href="icon-pos.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-pos.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<!-- ── LOADING ────────────────────────────────────────────── -->
<div id="screen-loading" class="screen active">
  <div class="loading-center">
    <div class="butterfly">🦋</div>
    <p class="tagline">cargando caja…</p>
  </div>
</div>

<!-- ── PIN CAJA ────────────────────────────────────────────── -->
<div id="screen-pin" class="screen">
  <div class="pin-wrap">
    <div class="brand-block-sm" style="justify-content:center;margin-bottom:2rem">
      <span>🦋</span>
      <span class="brand-name-sm">PosMaddre</span>
    </div>
    <div class="pin-display">
      <span id="pin-dot-1" class="pin-dot"></span>
      <span id="pin-dot-2" class="pin-dot"></span>
      <span id="pin-dot-3" class="pin-dot"></span>
      <span id="pin-dot-4" class="pin-dot"></span>
    </div>
    <div id="pin-error" class="error-msg hidden" style="margin:.75rem 1rem 0"></div>
    <div class="pin-pad">
      <button class="pin-btn" onclick="pinPress('1')">1</button>
      <button class="pin-btn" onclick="pinPress('2')">2</button>
      <button class="pin-btn" onclick="pinPress('3')">3</button>
      <button class="pin-btn" onclick="pinPress('4')">4</button>
      <button class="pin-btn" onclick="pinPress('5')">5</button>
      <button class="pin-btn" onclick="pinPress('6')">6</button>
      <button class="pin-btn" onclick="pinPress('7')">7</button>
      <button class="pin-btn" onclick="pinPress('8')">8</button>
      <button class="pin-btn" onclick="pinPress('9')">9</button>
      <button class="pin-btn pin-btn-clear" onclick="pinClear()">✕</button>
      <button class="pin-btn" onclick="pinPress('0')">0</button>
      <button class="pin-btn pin-btn-ok" onclick="pinSubmit()">→</button>
    </div>
    <div id="pin-destino" class="pin-destino hidden">
      <button class="btn-primary" onclick="pinIrA('pos')">🦋 Abrir Caja</button>
      <button class="btn-ghost" onclick="pinIrA('admin')" style="margin-top:.5rem">⚙️ Panel Admin</button>
    </div>
  </div>
</div>

<!-- ── POS ─────────────────────────────────────────────────── -->
<div id="screen-pos" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('pin');pinReset()">← Salir</button>
    <h2>🦋 Caja</h2>
    <button class="tab-switch-btn" onclick="posIrAdmin()">⚙️ Admin</button>
  </div>

  <div class="tk-layout">
    <!-- Cuadrícula de productos: cada toque suma 1 -->
    <div class="tk-grid-wrap">
      <div id="tk-grid" class="tk-grid"></div>

      <!-- Pedidos de hoy -->
      <div class="card pos-pedidos-panel">
        <div class="pos-pedidos-hoy-header">
          <p class="pos-agregar-title" style="margin:0">📋 Tickets de hoy</p>
          <button class="btn-link pos-pedidos-refresh" onclick="loadPedidosHoy()">↻ actualizar</button>
        </div>
        <p id="pos-pedidos-hoy-resumen" class="pos-pedidos-hoy-resumen"></p>
        <div id="pos-pedidos-hoy-list" class="pos-pedidos-list">
          <p style="color:var(--text-lt);font-size:.82rem">Cargando…</p>
        </div>
      </div>
    </div>

    <!-- Ticket actual -->
    <div id="tk-panel" class="tk-panel">
      <div class="tk-head" onclick="tkTogglePanel()">
        <span id="tk-num" class="tk-num">TICKET --</span>
        <span id="tk-count" class="tk-count"></span>
        <strong id="tk-total" class="tk-total">$0</strong>
      </div>
      <div class="tk-body">
        <div id="tk-items" class="tk-items"></div>

        <!-- Calculadora de vueltas -->
        <div id="tk-calc" class="tk-calc hidden">
          <div class="tk-calc-row">
            <label for="tk-paga">Paga con</label>
            <input id="tk-paga" type="text" inputmode="numeric" placeholder="$0" oninput="tkCalcVueltas()">
          </div>
          <div class="tk-calc-quick">
            <button onclick="tkPagaCon('exacto')">Exacto</button>
            <button onclick="tkPagaCon(10000)">10 mil</button>
            <button onclick="tkPagaCon(20000)">20 mil</button>
            <button onclick="tkPagaCon(50000)">50 mil</button>
            <button onclick="tkPagaCon(100000)">100 mil</button>
          </div>
          <p id="tk-vueltas" class="tk-vueltas"></p>
        </div>

        <div class="tk-actions">
          <button id="tk-limpiar-btn" class="btn-ghost" onclick="tkLimpiar()">Limpiar</button>
          <button id="tk-facturar-btn" class="btn-primary" onclick="tkFacturar()" disabled>Facturar</button>
        </div>
        <button id="tk-cancelar-edicion-btn" class="btn-link hidden" onclick="tkCancelarEdicion()">cancelar edición</button>
      </div>
    </div>
  </div>
</div>

<!-- ── LOADING OVERLAY ─────────────────────────────────────── -->
<div id="loading-overlay" class="loading-overlay hidden">
  <div class="butterfly spin">🦋</div>
</div>

<!-- ── TOAST ───────────────────────────────────────────────── -->
<div id="toast" class="toast hidden"></div>

<script src="shared.js?v=2"></script>
<script src="pos.js?v=6"></script>
</body>
</html>
