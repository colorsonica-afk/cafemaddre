<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Correos — Maddre</title>
<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="admin-topbar">
  <div class="admin-topbar-left">
    <span class="admin-logo">🦋 maddre</span>
  </div>
  <div class="admin-topbar-right">
    <button class="back-btn" onclick="volverAlPanel()">← Panel</button>
  </div>
</div>

<div class="admin-section">
  <div class="card" style="margin:1rem">
    <p class="card-title">📨 Mensaje a todos los vecinos</p>
    <div id="adm-recipients-pill" class="recipients-pill">👥 — vecinos recibirán este mensaje</div>

    <div class="field" style="margin-top:1rem">
      <label>Plantilla <span class="hint">(opcional — carga un HTML ya armado)</span></label>
      <select id="masivo-plantilla" onchange="cargarPlantillaCorreo()">
        <option value="">— sin plantilla, escribo el mensaje —</option>
      </select>
    </div>

    <div class="field">
      <label>Asunto</label>
      <input id="masivo-asunto" type="text" placeholder="Ej: ¡Hoy tenemos pistacho! 🦋">
    </div>
    <div class="field">
      <label>Mensaje <span class="hint">(texto normal, o pega HTML directo si quieres algo con formato/imágenes)</span></label>
      <textarea id="masivo-mensaje" placeholder="Escribe tu mensaje aquí, o pega HTML..." rows="7" style="width:100%;padding:.75rem;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:.95rem;background:var(--crema);resize:vertical;outline:none" oninput="updateEmailPreview()"></textarea>
    </div>
    <p class="mini-title" style="margin-bottom:.5rem">Vista previa</p>
    <div class="preview-email">
      <div class="email-header-preview">
        <div class="eh-logo">🦋</div>
        <div class="eh-name">maddre</div>
        <div class="eh-sub">Un mensaje para ti, vecino 🦋</div>
      </div>
      <div id="email-preview-body" class="email-body-preview">Tu mensaje aparecerá aquí...</div>
      <div class="email-footer-preview">
        Café Maddre · Miércoles a Domingo · 3 pm – 7 pm<br>Hecho con amor 🦋
      </div>
    </div>
    <button class="btn-primary" onclick="enviarMasivo()" style="margin-top:1rem">📨 Enviar a todos los vecinos</button>
  </div>
</div>

<!-- ── LOADING OVERLAY ─────────────────────────────────────── -->
<div id="loading-overlay" class="loading-overlay hidden">
  <div class="butterfly spin">🦋</div>
</div>

<!-- ── TOAST ───────────────────────────────────────────────── -->
<div id="toast" class="toast hidden"></div>

<script src="shared.js?v=4"></script>
<script src="correos.js?v=2"></script>
</body>
</html>
